[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-1-python"
version = "1.0.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]